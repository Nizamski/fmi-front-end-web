<svg width="520" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Form container -->
  <rect x="20" y="20" width="480" height="660" fill="white" stroke="#ccc" stroke-width="2" rx="5"/>

  <!-- Form title -->
  <text x="250" y="45" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Форма за регистрация</text>

  <!-- Basic Information Section -->
  <text x="40" y="75" font-family="Arial" font-size="14" font-weight="bold">Основна информация:</text>

  <!-- Name field -->
  <text x="40" y="100" font-family="Arial" font-size="12">Име: *</text>
  <rect x="40" y="105" width="200" height="25" fill="white" stroke="#999" stroke-width="1"/>

  <!-- Last name field -->
  <text x="260" y="100" font-family="Arial" font-size="12">Фамилия: *</text>
  <rect x="260" y="105" width="200" height="25" fill="white" stroke="#999" stroke-width="1"/>

  <!-- Email field -->
  <text x="40" y="155" font-family="Arial" font-size="12">Email: *</text>
  <rect x="40" y="160" width="420" height="25" fill="white" stroke="#999" stroke-width="1"/>

  <!-- Password field -->
  <text x="40" y="210" font-family="Arial" font-size="12">Парола: *</text>
  <rect x="40" y="215" width="200" height="25" fill="white" stroke="#999" stroke-width="1"/>
  <text x="245" y="225" font-family="Arial" font-size="10" fill="#666">(мин. 8 символа)</text>

  <!-- Confirm password field -->
  <text x="40" y="265" font-family="Arial" font-size="12">Потвърди парола: *</text>
  <rect x="40" y="270" width="200" height="25" fill="white" stroke="#999" stroke-width="1"/>

  <!-- Additional Information Section -->
  <text x="40" y="325" font-family="Arial" font-size="14" font-weight="bold">Допълнителна информация:</text>

  <!-- Programming experience radio buttons -->
  <text x="40" y="350" font-family="Arial" font-size="12">Има ли предишен опит с програмиране:</text>
  <circle cx="50" cy="365" r="6" fill="white" stroke="#999" stroke-width="1"/>
  <text x="65" y="370" font-family="Arial" font-size="11">Да</text>
  <circle cx="120" cy="365" r="6" fill="white" stroke="#999" stroke-width="1"/>
  <text x="135" y="370" font-family="Arial" font-size="11">Не</text>

  <!-- University rules checkbox -->
  <rect x="40" y="385" width="12" height="12" fill="white" stroke="#999" stroke-width="1"/>
  <text x="60" y="395" font-family="Arial" font-size="11">Съгласен съм с правилата на СУ</text>

  <!-- Faculty dropdown -->
  <text x="40" y="420" font-family="Arial" font-size="12">Факултет:</text>
  <rect x="40" y="425" width="200" height="25" fill="white" stroke="#999" stroke-width="1"/>
  <text x="45" y="440" font-family="Arial" font-size="11" fill="#666">Изберете факултет</text>
  <polygon points="230,435 235,440 230,445" fill="#666"/>

  <!-- Comments textarea -->
  <text x="40" y="475" font-family="Arial" font-size="12">Допълнителни коментари:</text>
  <rect x="40" y="480" width="420" height="80" fill="white" stroke="#999" stroke-width="1"/>

  <!-- File upload -->
  <text x="40" y="585" font-family="Arial" font-size="12">Качи файл (.pdf):</text>
  <rect x="40" y="590" width="200" height="25" fill="#f9f9f9" stroke="#999" stroke-width="1"/>
  <text x="45" y="605" font-family="Arial" font-size="10" fill="#666">Избери файл</text>
  <rect x="250" y="590" width="80" height="25" fill="#e9e9e9" stroke="#999" stroke-width="1"/>
  <text x="290" y="605" text-anchor="middle" font-family="Arial" font-size="10">Browse</text>

  <!-- Buttons -->
  <rect x="280" y="630" width="100" height="30" fill="#6c757d" stroke="#545b62" stroke-width="1" rx="3"/>
  <text x="330" y="648" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Изчисти</text>

  <rect x="390" y="630" width="110" height="30" fill="#007bff" stroke="#0056b3" stroke-width="1" rx="3"/>
  <text x="445" y="648" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Регистрирай се</text>

  <!-- Required field note -->
  <text x="40" y="680" font-family="Arial" font-size="10" fill="#666">* задължителни полета</text>
</svg>